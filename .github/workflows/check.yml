name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: ./scripts/build-package.ps1 -Release
      - run: ./scripts/test-package.ps1 -Archive (Get-ChildItem artifacts/*-source.zip).FullName
